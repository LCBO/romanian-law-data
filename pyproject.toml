[project]
name = "instante"
version = "0.1.0"
description = "Romanian High Court of Cassation and Justice (ÎCCJ) Case Law Corpus to Zstd Parquet & DuckDB FTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "pandera[polars]>=0.20.0",
    "polars>=1.0.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "selectolax>=0.3.21",
    "tqdm>=4.66.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
