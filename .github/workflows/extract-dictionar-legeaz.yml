name: Extract Legal Dictionary (legeaz.net)

on:
  schedule:
    - cron: '0 2 * * 6' # Weekly on Saturday at 02:00 UTC
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Maximum dictionary pages to crawl (1-104)'
        required: false
        default: '104'
        type: string

permissions:
  contents: write

jobs:
  extract-dictionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Download existing dictionary cache
        run: |
          mkdir -p data/cache
          gh release download decisions-cache --pattern 'swept_dictionar_urls.parquet' --dir data/cache || echo "No previous dictionary cache."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Legal Dictionary Extractor
        run: |
          uv run python -m etl.extract_dictionar --max-pages ${{ inputs.max_pages || 104 }}

      - name: Upload Dictionary Parquet Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictionar-juridic-parquet
          path: data/dictionar_juridic.parquet
          if-no-files-found: warn

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="decisions/$(date -u +%Y-%m-%d)"
          if [ -f "data/dictionar_juridic.parquet" ]; then
            # Ensure dated release exists
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --title "Romanian Legal Corpus $TAG" --notes "Automated release of Romanian legal datasets." || true
            fi
            gh release upload "$TAG" data/dictionar_juridic.parquet --clobber || true

            # Ensure latest release exists
            if ! gh release view latest >/dev/null 2>&1; then
              gh release create latest --title "Romanian Legal Corpus (Latest)" --notes "Latest build of all Romanian legal datasets." || true
            fi
            gh release upload latest data/dictionar_juridic.parquet --clobber || true
          fi

          # Update cache release
          if [ -f "data/cache/swept_dictionar_urls.parquet" ]; then
            if ! gh release view decisions-cache >/dev/null 2>&1; then
              gh release create decisions-cache --title "Pipeline Checkpoint Cache" --notes "Internal cache artifacts." || true
            fi
            gh release upload decisions-cache data/cache/swept_dictionar_urls.parquet --clobber || true
          fi

      - name: Sync to Cloudflare R2 (Optional)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'lawchat-documents' }}
        run: |
          if [ -n "$R2_ENDPOINT" ] || [ -n "$R2_ACCOUNT_ID" ]; then
            uv run python -m etl.r2_sync
          else
            echo "R2 credentials not configured, skipping R2 sync."
          fi


