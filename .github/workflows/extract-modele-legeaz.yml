name: Extract Legal Document Templates (legeaz.net)

on:
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Maximum catalog pages to crawl (1-18)'
        required: false
        default: '18'
        type: string

permissions:
  contents: write

jobs:
  extract-modele:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Download existing template cache
        run: |
          mkdir -p data/cache
          gh release download decisions-cache --pattern 'swept_modele_urls.parquet' --dir data/cache || echo "No previous template cache."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Legal Templates Extractor
        run: |
          uv run python -m etl.extract_modele --max-pages ${{ inputs.max_pages || 18 }}

      - name: Upload Modele Parquet Artifact
        uses: actions/upload-artifact@v4
        with:
          name: modele-documente-parquet
          path: data/modele_documente.parquet
          if-no-files-found: warn

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="decisions/$(date -u +%Y-%m-%d)"
          if [ -f "data/modele_documente.parquet" ]; then
            # Ensure dated release exists
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --title "Romanian Legal Corpus $TAG" --notes "Automated release of Romanian legal datasets." || true
            fi
            gh release upload "$TAG" data/modele_documente.parquet --clobber || true

            # Ensure latest release exists
            if ! gh release view latest >/dev/null 2>&1; then
              gh release create latest --title "Romanian Legal Corpus (Latest)" --notes "Latest build of all Romanian legal datasets." || true
            fi
            gh release upload latest data/modele_documente.parquet --clobber || true
          fi

          # Update cache release
          if [ -f "data/cache/swept_modele_urls.parquet" ]; then
            if ! gh release view decisions-cache >/dev/null 2>&1; then
              gh release create decisions-cache --title "Pipeline Checkpoint Cache" --notes "Internal cache artifacts." || true
            fi
            gh release upload decisions-cache data/cache/swept_modele_urls.parquet --clobber || true
          fi

